        <h1>📢 รายงานปัญหา</h1>
    <p class="subtitle">แจ้งปัญหาการใช้งานหรือปัญหาที่พบ</p>

    <form class="report-form">
      <div class="form-group">
        <label>หัวข้อปัญหา</label>
        <input type="text" placeholder="ปัญหาที่เราพบ" required>
      </div>

      <div class="form-group">
        <label>ประเภทปัญหา</label>
        <select required>
          <option value=""> เลือกประเภท </option>
          <option>อุปกรณ์ชำรุด</option>
          <option>ห้องน้ำ</option>
          <option>ห้องเรียน</option>
          <option>อื่น ๆ</option>
        </select>
      </div>

      <div class="form-group">
        <label>ระดับความเร่งด่วน</label>
        <select required>
          <option>ต่ำ</option>
          <option>ปานกลาง</option>
          <option>สูง</option>
          <option>วิกฤต</option>
        </select>
      </div>

      <div class="form-group">
        <label>รายละเอียดปัญหา</label>
        <textarea rows="5" placeholder="อธิบายปัญหาที่พบ..." required></textarea>
      </div>

      <button type="submit">ส่งรายงาน</button>
    </form>
